seed: 1234
model_name: conv2d_classifier
trainer_name: mse
model_params:
  in_channels: 1
  num_classes: 10
input_processors:
  - name: normalizer
    params:
      dims: [0, 2, 3]
train_samples: 5000
val_samples: 1000
epochs: 100
batch_size: 128
lr: 0.001
patience: 10
dataset_dir: data/mnist
out_dir: data
output: mnist.pt
